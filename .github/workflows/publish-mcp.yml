name: Publish MCP

on:
  workflow_dispatch:
  push:
    tags:
      - 'mcp-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify OAuth and admin compatibility
        run: npm test -- src/auth.test.ts src/admin.test.ts --reporter=default --reporter=json --outputFile=auth-results.json

      - name: Reject incomplete or skipped compatibility tests
        run: |
          node -e "const r=require('./auth-results.json'); if (!r.success || r.numPassedTests !== 56 || r.numFailedTests !== 0 || r.numPendingTests !== 0 || r.numTodoTests !== 0) process.exit(1)"

      - name: Verify fail-closed access requests
        run: npm run test:auth

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
